services:
  - type: web
    name: preporbit-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: "PrepOrbit AI"
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 45
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 14
      - key: DATABASE_URL
        fromDatabase:
          name: preporbit-db
          property: connectionString
      - key: CORS_ORIGINS_RAW
        value: https://preporbit.vercel.app
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: SENTRY_DSN
        sync: false
      - key: CHROMA_PATH
        value: /var/data/chroma
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SOURCE_ROOT
        value: /var/data

disk:
  name: chroma-data
  mountPath: /var/data
  sizeGB: 5

databases:
  - name: preporbit-db
    databaseName: preporbit
    plan: starter
