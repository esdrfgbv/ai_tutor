services:

* type: web
  name: preporbit-api
  env: python

  buildCommand: cd backend && pip install --upgrade pip && pip install -r requirements.txt

  startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT

  healthCheckPath: /health

  envVars:

  * key: PYTHON_VERSION
    value: 3.11.11

  * key: ENVIRONMENT
    value: production

  * key: APP_NAME
    value: "PrepOrbit AI"

  * key: SECRET_KEY
    generateValue: true

  * key: ACCESS_TOKEN_EXPIRE_MINUTES
    value: "45"

  * key: REFRESH_TOKEN_EXPIRE_DAYS
    value: "14"

  * key: SUPABASE_DB_HOST
    sync: false

  * key: SUPABASE_DB_PORT
    value: "5432"

  * key: SUPABASE_DB_NAME
    sync: false

  * key: SUPABASE_DB_USER
    sync: false

  * key: SUPABASE_DB_PASSWORD
    sync: false

  * key: CORS_ORIGINS_RAW
    value: https://ai-tutor-beta-black.vercel.app,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173

  * key: AI_PROVIDER
    value: groq

  * key: GROQ_API_KEY
    sync: false

  * key: GROQ_MODEL
    value: llama-3.1-8b-instant

  * key: CHROMA_PATH
    value: /var/data/chroma

  * key: UPLOAD_DIR
    value: /var/data/uploads

  * key: SOURCE_ROOT
    value: /var/data

  disk:
  name: chroma-data
  mountPath: /var/data
  sizeGB: 5
